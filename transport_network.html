        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Central", "label": "Central", "shape": "dot", "title": "Station: Central"}, {"color": "#97c2fc", "id": "Market", "label": "Market", "shape": "dot", "title": "Station: Market"}, {"color": "#97c2fc", "id": "University", "label": "University", "shape": "dot", "title": "Station: University"}, {"color": "#97c2fc", "id": "Railway", "label": "Railway", "shape": "dot", "title": "Station: Railway"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "Central", "label": "650", "title": "Passenger Flow: 650", "to": "Market", "value": 650}, {"arrows": "to", "from": "Central", "label": "415", "title": "Passenger Flow: 415", "to": "University", "value": 415}, {"arrows": "to", "from": "Market", "label": "790", "title": "Passenger Flow: 790", "to": "Railway", "value": 790}, {"arrows": "to", "from": "Market", "label": "270", "title": "Passenger Flow: 270", "to": "University", "value": 270}, {"arrows": "to", "from": "University", "label": "385", "title": "Passenger Flow: 385", "to": "Railway", "value": 385}, {"arrows": "to", "from": "University", "label": "90", "title": "Passenger Flow: 90", "to": "Market", "value": 90}, {"arrows": "to", "from": "University", "label": "100", "title": "Passenger Flow: 100", "to": "Central", "value": 100}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"shape": "dot", "size": 25, "font": {"size": 18}}, "edges": {"arrows": {"to": {"enabled": true}}, "font": {"size": 14, "align": "middle"}}, "physics": {"enabled": true, "stabilization": {"iterations": 200}}, "interaction": {"hover": true, "zoomView": true, "dragView": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
